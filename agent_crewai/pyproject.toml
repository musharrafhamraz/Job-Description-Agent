[project]
name = "agent_crewai"
version = "0.1.0"
description = "CV Screening Agent using CrewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "crewai-tools==0.17.0",
    "langchain-groq==0.2.1",
    "python-dotenv==1.0.1"
]

[project.scripts]
agent_crewai = "agent_crewai.main:run"
run_crew = "agent_crewai.main:run"
train = "agent_crewai.main:train"
replay = "agent_crewai.main:replay"
test = "agent_crewai.main:test"
run_with_trigger = "agent_crewai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
